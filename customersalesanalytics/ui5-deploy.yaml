specVersion: "3.1"
metadata:
  name: com.example.customeranalytics.customersalesanalytics
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://s40lp1.ucc.cit.tum.de
          client: 324
          auth: basic
        credentials:
          username: env:UI5_USERNAME
          password: env:UI5_PASSWORD
        app:
          name: Z324_CUST_APP
          description: Customer Sales Analytics
          package: Z_324_PROJECT
          transport: S40K921334
        exclude:
          - /test/